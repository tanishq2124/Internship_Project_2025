<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split Panel Auth Form</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        /* --- CSS STYLES --- */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

        :root {
            /* Dark mode colors */
            --primary-accent: #8e44ad; /* A deep purple/violet for accent */
            --background-dark: #1a1a2e; /* Very dark background */
            --container-dark: #2c2c4a; /* Slightly lighter dark for container */
            --text-light: #e0e0e0; /* Light text on dark background */
            --text-muted: #a0a0b0; /* Muted text for secondary info */
            --input-bg-dark: #3a3a5a; /* Darker input background */
            --input-border-dark: #4a4a6a; /* Input border */
            --shadow-dark: 0 10px 30px rgba(0, 0, 0, 0.4); /* Darker shadow */
            --button-hover: #9b59b6; /* Lighter purple on hover */
            --error-red: #e74c3c; /* Red for errors */
            --success-green: #2ecc71; /* Green for success */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--background-dark); /* Dark background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden; 
            color: var(--text-light); /* Default text color */
        }

        .container {
            background-color: var(--container-dark); /* Darker container */
            border-radius: 15px;
            box-shadow: var(--shadow-dark); /* Darker shadow */
            position: relative;
            overflow: hidden;
            width: 850px;
            max-width: 90%;
            min-height: 550px;
        }
        
        /* --- Panel Containers --- */
        .panel {
            position: absolute;
            top: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 0.6s ease-in-out;
            padding: 0 40px;
            text-align: center;
        }

        /* --- Left/Information Panel (Dark Accent Side) --- */
        .info-panel {
            left: 0;
            width: 50%;
            background: linear-gradient(to right, var(--primary-accent), #7f399f); /* Gradient purple */
            color: var(--text-light);
            z-index: 2;
        }

        .info-panel h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .info-panel p {
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .info-panel .button {
            background-color: transparent;
            border: 2px solid var(--text-light);
            color: var(--text-light);
            padding: 12px 45px;
            font-size: 1em;
            font-weight: 600;
            border-radius: 25px;
            cursor: pointer;
            transition: background-color 0.3s ease, color 0.3s ease;
            text-transform: uppercase;
        }

        .info-panel .button:hover {
            background-color: var(--text-light);
            color: var(--primary-accent);
        }

        /* --- Form Panels (Sign Up/Sign In) --- */
        .form-panel {
            left: 0;
            width: 50%;
            opacity: 0;
            z-index: 1;
        }

        .sign-in-panel {
            transform: translateX(0);
            opacity: 1;
            z-index: 5;
        }

        .sign-up-panel {
            transform: translateX(0);
        }

        .form-panel form {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 320px;
            padding: 0 20px;
        }

        .form-panel h1 {
            font-size: 2.2em;
            margin-bottom: 20px;
            color: var(--text-light);
        }

        .social-container {
            margin: 20px 0;
        }

        .social-container a {
            border: 1px solid var(--input-border-dark);
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin: 0 5px;
            height: 40px;
            width: 40px;
            color: var(--text-muted);
            font-size: 1.2em;
            transition: all 0.3s ease;
        }

        .social-container a:hover {
            background-color: var(--primary-accent);
            color: var(--text-light);
            border-color: var(--primary-accent);
        }

        .form-panel p {
            font-size: 0.9em;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .form-panel input {
            background-color: var(--input-bg-dark); /* Dark input background */
            border: 1px solid var(--input-border-dark); /* Dark input border */
            padding: 12px 15px;
            margin: 8px 0;
            width: 100%;
            border-radius: 8px;
            font-size: 0.95em;
            color: var(--text-light); /* Light text in input */
            transition: border-color 0.3s ease;
        }

        .form-panel input::placeholder {
            color: var(--text-muted);
        }

        .form-panel input:focus {
            outline: none;
            border-color: var(--primary-accent);
        }

        .form-panel a.forgot-password {
            color: var(--text-muted);
            font-size: 0.9em;
            text-decoration: none;
            margin-top: 10px;
            margin-bottom: 20px;
            transition: color 0.3s ease;
        }

        .form-panel a.forgot-password:hover {
            color: var(--primary-accent);
        }

        .form-panel .button {
            background-color: var(--primary-accent);
            color: var(--text-light);
            padding: 12px 45px;
            font-size: 1em;
            font-weight: 600;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 10px;
        }

        .form-panel .button:hover {
            background-color: var(--button-hover);
        }

        /* --- Overlay Panel --- */
        .overlay-container {
            position: absolute;
            top: 0;
            left: 50%;
            width: 50%;
            height: 100%;
            overflow: hidden;
            transition: transform 0.6s ease-in-out;
            z-index: 100;
        }

        .overlay {
            background: linear-gradient(to right, var(--primary-accent), #7f399f); /* Gradient purple */
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 0 0;
            color: var(--text-light);
            position: relative;
            left: -100%;
            height: 100%;
            width: 200%;
            transform: translateX(0);
            transition: transform 0.6s ease-in-out;
        }

        .overlay-panel {
            position: absolute;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 40px;
            text-align: center;
            top: 0;
            height: 100%;
            width: 50%;
            transform: translateX(0);
            transition: transform 0.6s ease-in-out;
        }

        .overlay-left {
            transform: translateX(-20%);
        }

        .overlay-right {
            right: 0;
            transform: translateX(0);
        }

        .overlay-panel h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .overlay-panel p {
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .overlay-panel .button {
            background-color: transparent;
            border: 2px solid var(--text-light);
            color: var(--text-light);
            padding: 12px 45px;
            font-size: 1em;
            font-weight: 600;
            border-radius: 25px;
            cursor: pointer;
            transition: background-color 0.3s ease, color 0.3s ease;
            text-transform: uppercase;
        }

        .overlay-panel .button:hover {
            background-color: var(--text-light);
            color: var(--primary-accent);
        }

        /* --- Active Container State --- */
        .container.right-panel-active .sign-in-panel {
            transform: translateX(100%);
        }

        .container.right-panel-active .sign-up-panel {
            transform: translateX(100%);
            opacity: 1;
            z-index: 5;
        }

        .container.right-panel-active .overlay-container {
            transform: translateX(-100%);
        }

        .container.right-panel-active .overlay {
            transform: translateX(50%);
        }

        .container.right-panel-active .overlay-left {
            transform: translateX(0);
        }

        .container.right-panel-active .overlay-right {
            transform: translateX(20%);
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <div class="form-panel sign-up-panel">
            <form action="#">
                <h1>Create Account</h1>
                <div class="social-container">
                    <a href="#" class="social"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" class="social"><i class="fab fa-google-plus-g"></i></a>
                    <a href="#" class="social"><i class="fab fa-linkedin-in"></i></a>
                </div>
                <p>or use your email for registration</p>
                <input type="text" placeholder="Name" />
                <input type="email" placeholder="Email" />
                <input type="password" placeholder="Password" />
                <button class="button">Sign Up</button>
            </form>
        </div>
        <div class="form-panel sign-in-panel">
            <form action="#">
                <h1>Sign in</h1>
                <div class="social-container">
                    <a href="#" class="social"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" class="social"><i class="fab fa-google-plus-g"></i></a>
                    <a href="#" class="social"><i class="fab fa-linkedin-in"></i></a>
                </div>
                <p>or use your account</p>
                <input type="email" placeholder="Email" />
                <input type="password" placeholder="Password" />
                <a href="#" class="forgot-password">Forgot your password?</a>
                <button class="button">Sign In</button>
            </form>
        </div>
        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <h1>Welcome Back!</h1>
                    <p>To keep connected with us please login with your personal info</p>
                    <button class="button" id="signIn">Sign In</button>
                </div>
                <div class="overlay-panel overlay-right">
                    <h1>Hello, Friend!</h1>
                    <p>Enter your personal details and start journey with us</p>
                    <button class="button" id="signUp">Sign Up</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const signUpButton = document.getElementById('signUp');
        const signInButton = document.getElementById('signIn');
        const container = document.getElementById('container');

        signUpButton.addEventListener('click', () => {
            container.classList.add("right-panel-active");
        });

        signInButton.addEventListener('click', () => {
            container.classList.remove("right-panel-active");
        });
    </script>
</body>
</html>
