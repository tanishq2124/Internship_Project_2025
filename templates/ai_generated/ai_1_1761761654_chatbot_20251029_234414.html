<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handmade Delights Chatbot - Your Crafty Assistant</title>
    <meta name="description" content="Chat with our AI assistant for help with handmade accessories, orders, custom requests, and more.">
    <meta name="keywords" content="handmade accessories, chatbot, customer service, craft, jewelry, personalized gifts">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">
    <style>
        /* Global Styles & Variables */
        :root {
            --primary-bg: #FDFDFD; /* Very light, almost white background */
            --secondary-bg: #FFFFFF; /* Pure white for main containers */
            --text-color-dark: #333333;
            --text-color-light: #666666;
            --accent-color: #B28FAD; /* Soft, muted lavender/rose for buttons/highlights */
            --accent-color-hover: #C5AEC2; /* Slightly lighter for hover */
            --bot-message-bg: #E8F8F5; /* Very light mint green for bot messages */
            --user-message-bg: #F2E7DC; /* Very light warm beige for user messages */
            --border-color: #E0E0E0;
            --shadow-light: 0 4px 15px rgba(0, 0, 0, 0.08);
            --shadow-subtle: 0 2px 8px rgba(0, 0, 0, 0.05);
            --font-family-primary: 'Arial', sans-serif;
            --font-family-secondary: 'Georgia', serif; /* For a touch of craft elegance */
        }

        /* Base Styling */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family-primary);
            background-color: var(--primary-bg);
            color: var(--text-color-dark);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-y: scroll; /* Allow body scroll if content exceeds viewport */
        }

        /* Chatbot Container */
        .chatbot-container {
            width: 100%;
            max-width: 700px;
            background-color: var(--secondary-bg);
            border-radius: 12px;
            box-shadow: var(--shadow-light);
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Ensures rounded corners are respected */
            min-height: 600px; /* Minimum height for larger screens */
            max-height: 90vh; /* Max height relative to viewport */
        }

        /* Chatbot Header */
        .chatbot-header {
            background-color: var(--accent-color);
            color: var(--secondary-bg);
            padding: 18px 25px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .chatbot-header h1 {
            font-size: 1.6em;
            font-family: var(--font-family-secondary);
            font-weight: normal;
        }

        .chatbot-header .icon {
            font-size: 1.5em;
            vertical-align: middle;
        }

        /* Chat Messages Area */
        .chat-messages {
            flex-grow: 1; /* Takes up available space */
            padding: 20px;
            overflow-y: auto; /* Scrollable chat history */
            display: flex;
            flex-direction: column;
            gap: 12px;
            -webkit-overflow-scrolling: touch; /* Smooth scrolling on iOS */
        }

        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Chat Message Bubbles */
        .chat-message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 20px;
            line-height: 1.4;
            box-shadow: var(--shadow-subtle);
            word-wrap: break-word; /* Prevents long words from breaking layout */
        }

        .chat-message.bot {
            background-color: var(--bot-message-bg);
            align-self: flex-start;
            border-bottom-left-radius: 4px; /* Slightly different corner for visual distinction */
            color: var(--text-color-dark);
        }

        .chat-message.user {
            background-color: var(--user-message-bg);
            align-self: flex-end;
            border-bottom-right-radius: 4px; /* Slightly different corner for visual distinction */
            color: var(--text-color-dark);
        }

        .chat-message .timestamp {
            display: block;
            font-size: 0.75em;
            color: var(--text-color-light);
            margin-top: 5px;
            text-align: right;
        }

        .chat-message.bot .timestamp {
            text-align: left;
        }

        .chat-message p {
            margin: 0;
        }

        /* Typing indicator */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            align-self: flex-start;
            padding: 10px 18px;
            border-radius: 20px;
            background-color: var(--bot-message-bg);
            color: var(--text-color-dark);
            font-size: 0.9em;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            border-bottom-left-radius: 4px;
        }

        .typing-indicator.visible {
            opacity: 1;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background-color: var(--accent-color);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
        }

        /* Chat Input Area */
        .chat-input {
            display: flex;
            padding: 15px 20px;
            border-top: 1px solid var(--border-color);
            background-color: var(--secondary-bg);
            gap: 10px;
        }

        .chat-input input[type="text"] {
            flex-grow: 1;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 25px;
            font-size: 1em;
            outline: none;
            transition: border-color 0.2s ease;
            background-color: #F8F8F8;
            color: var(--text-color-dark);
        }

        .chat-input input[type="text"]:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(var(--accent-color), 0.2);
        }

        .chat-input button {
            background-color: var(--accent-color);
            color: var(--secondary-bg);
            border: none;
            border-radius: 25px;
            padding: 12px 20px;
            font-size: 1em;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            white-space: nowrap; /* Prevents text from wrapping */
        }

        .chat-input button:hover {
            background-color: var(--accent-color-hover);
            transform: translateY(-1px);
        }

        .chat-input button:active {
            transform: translateY(0);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .chatbot-container {
                max-width: 95%;
                min-height: 90vh; /* On mobile, take up more screen space */
                max-height: 95vh;
                border-radius: 8px;
            }

            .chatbot-header {
                padding: 15px 20px;
            }

            .chatbot-header h1 {
                font-size: 1.4em;
            }

            .chat-messages {
                padding: 15px;
                gap: 10px;
            }

            .chat-message {
                max-width: 90%;
                padding: 10px 15px;
                font-size: 0.95em;
            }

            .chat-input {
                flex-direction: row; /* Keep input and button side-by-side */
                padding: 10px 15px;
            }

            .chat-input input[type="text"] {
                padding: 10px 12px;
                font-size: 0.9em;
            }

            .chat-input button {
                padding: 10px 15px;
                font-size: 0.9em;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            .chatbot-container {
                min-height: 100vh; /* Full screen on very small devices */
                max-height: 100vh;
                border-radius: 0;
                box-shadow: none;
            }
            .chatbot-header h1 {
                font-size: 1.2em;
            }
            .chat-input button {
                padding: 10px; /* Smaller button */
                min-width: 50px; /* Ensure button isn't too small */
            }
            .chat-input button span {
                display: none; /* Hide text on small screens */
            }
            .chat-input button::before {
                content: '➤'; /* Use an icon or arrow */
                font-size: 1.2em;
                display: inline-block;
            }
        }
    </style>
</head>
<body>
    <div class="chatbot-container">
        <header class="chatbot-header">
            <span class="icon" aria-hidden="true">✨</span>
            <h1>Handmade Delights Assistant</h1>
        </header>

        <main class="chat-messages" id="chatMessages">
            <div class="chat-message bot">
                <p>Hello! I'm your friendly assistant from Handmade Delights. How can I help you find the perfect accessory or answer your questions today?</p>
                <span class="timestamp">Just now</span>
            </div>
            <!-- Chat messages will be dynamically added here -->
            <div class="typing-indicator" id="typingIndicator">
                <span></span><span></span><span></span>
            </div>
        </main>

        <div class="chat-input">
            <input type="text" id="messageInput" placeholder="Type your message..." aria-label="Chat message input">
            <button id="sendMessageBtn" aria-label="Send message">
                <span>Send</span>
                <!-- Optional SVG icon for send -->
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-send"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendMessageBtn = document.getElementById('sendMessageBtn');
        const typingIndicator = document.getElementById('typingIndicator');

        // Function to get current time for timestamp
        function getCurrentTime() {
            const now = new Date();
            return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        // Function to add a message to the chat
        function addMessage(text, sender) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('chat-message', sender);
            messageElement.innerHTML = `<p>${text}</p><span class="timestamp">${getCurrentTime()}</span>`;
            chatMessages.appendChild(messageElement);
            chatMessages.scrollTop = chatMessages.scrollHeight; // Scroll to bottom
        }

        // Simulate bot response
        function getBotResponse(userMessage) {
            const lowerCaseMsg = userMessage.toLowerCase();

            if (lowerCaseMsg.includes('hello') || lowerCaseMsg.includes('hi')) {
                return "Hi there! How can I assist you with our beautiful handmade accessories today?";
            } else if (lowerCaseMsg.includes('product') || lowerCaseMsg.includes('item') || lowerCaseMsg.includes('accessories')) {
                return "We have a wonderful range of handmade accessories! Are you looking for something specific like necklaces, earrings, bracelets, or custom designs?";
            } else if (lowerCaseMsg.includes('order') || lowerCaseMsg.includes('delivery')) {
                return "To check your order status, please provide your order number. For delivery inquiries, I can connect you to our support team.";
            } else if (lowerCaseMsg.includes('custom') || lowerCaseMsg.includes('personalized')) {
                return "Absolutely! We love creating custom pieces. Please tell me more about what you have in mind, and I'll guide you through the process.";
            } else if (lowerCaseMsg.includes('price') || lowerCaseMsg.includes('cost')) {
                return "Prices vary depending on the item and customization. Could you tell me which accessory you're interested in, and I can give you more details?";
            } else if (lowerCaseMsg.includes('return') || lowerCaseMsg.includes('exchange')) {
                return "You can find our return and exchange policy on our 'FAQ' page. Would you like me to provide a direct link?";
            } else if (lowerCaseMsg.includes('contact')) {
                return "You can reach our customer support team via email at support@handmadedelights.com or call us at (123) 456-7890 during business hours.";
            } else if (lowerCaseMsg.includes('thank you') || lowerCaseMsg.includes('thanks')) {
                return "You're very welcome! Is there anything else I can help you with?";
            } else {
                return "I'm still learning, but I'll do my best to help! Could you rephrase your question or ask about our products, orders, or custom requests?";
            }
        }

        // Event listener for sending a message
        function sendMessage() {
            const userMessage = messageInput.value.trim();
            if (userMessage === '') return;

            addMessage(userMessage, 'user');
            messageInput.value = ''; // Clear input

            // Show typing indicator
            typingIndicator.classList.add('visible');
            chatMessages.scrollTop = chatMessages.scrollHeight; // Scroll to show indicator

            // Simulate bot response after a short delay
            setTimeout(() => {
                typingIndicator.classList.remove('visible');
                const botResponse = getBotResponse(userMessage);
                addMessage(botResponse, 'bot');
            }, Math.random() * 1500 + 800); // Random delay between 0.8s and 2.3s
        }

        sendMessageBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                event.preventDefault(); // Prevent new line in input
                sendMessage();
            }
        });

        // Focus on input when page loads
        document.addEventListener('DOMContentLoaded', () => {
            messageInput.focus();
        });
    </script>
</body>
</html>
