<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmerBot - Your Agricultural Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* General Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background: linear-gradient(135deg, #a8e063 0%, #56ab2f 100%); /* Fresh, earthy gradient */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }

        /* Chatbot Container */
        .chatbot-container {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.2);
            max-width: 450px;
            width: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 70vh; /* Fixed height for chatbot */
            min-height: 500px;
            max-height: 800px;
        }

        /* Chatbot Header */
        .chatbot-header {
            background: #56ab2f; /* Darker green for header */
            color: #fff;
            padding: 18px 25px;
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.4em;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chatbot-header span {
            margin-right: 10px;
            font-size: 1.2em; /* Emoji size */
        }

        /* Chatbot Messages Area */
        .chatbot-messages {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: #f9fdf7; /* Very light green background */
            border-bottom: 1px solid #eee;
            scroll-behavior: smooth;
        }

        /* Individual Message Styling */
        .message {
            display: flex;
            margin-bottom: 15px;
            max-width: 85%;
            word-wrap: break-word;
        }

        .message.bot {
            justify-content: flex-start;
            margin-right: auto;
        }

        .message.user {
            justify-content: flex-end;
            margin-left: auto;
        }

        .message-bubble {
            padding: 12px 18px;
            border-radius: 20px;
            line-height: 1.5;
            font-size: 0.95em;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .message.bot .message-bubble {
            background-color: #e0f2d2; /* Light green for bot */
            color: #333;
            border-bottom-left-radius: 5px;
        }

        .message.user .message-bubble {
            background-color: #56ab2f; /* Darker green for user */
            color: #fff;
            border-bottom-right-radius: 5px;
        }

        .message p {
            margin: 0;
        }

        /* Input Area */
        .chatbot-input-area {
            display: flex;
            padding: 15px 20px;
            background-color: #fff;
            border-top: 1px solid #eee;
        }

        .chatbot-input-area input {
            flex-grow: 1;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 1em;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .chatbot-input-area input:focus {
            border-color: #56ab2f;
            box-shadow: 0 0 0 3px rgba(86, 171, 47, 0.2);
        }

        .chatbot-input-area button {
            background-color: #56ab2f;
            color: #fff;
            border: none;
            border-radius: 25px;
            padding: 12px 20px;
            margin-left: 10px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: background-color 0.3s ease, transform 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .chatbot-input-area button:hover {
            background-color: #428d25;
            transform: translateY(-1px);
        }

        .chatbot-input-area button:active {
            transform: translateY(0);
        }

        /* Scrollbar Styling */
        .chatbot-messages::-webkit-scrollbar {
            width: 8px;
        }

        .chatbot-messages::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .chatbot-messages::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }

        .chatbot-messages::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .chatbot-container {
                height: 95vh;
                min-height: unset;
                max-height: unset;
                border-radius: 10px;
                box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);
            }

            .chatbot-header {
                font-size: 1.2em;
                padding: 15px 20px;
            }

            .chatbot-messages {
                padding: 15px;
            }

            .message-bubble {
                padding: 10px 15px;
                font-size: 0.9em;
            }

            .chatbot-input-area {
                padding: 10px 15px;
            }

            .chatbot-input-area input {
                padding: 10px 12px;
                font-size: 0.9em;
            }

            .chatbot-input-area button {
                padding: 10px 15px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="chatbot-container">
        <div class="chatbot-header">
            <span>🚜</span> FarmerBot
        </div>
        <div class="chatbot-messages" id="chatbot-messages">
            <!-- Initial bot messages will be injected here by JS -->
        </div>
        <div class="chatbot-input-area">
            <input type="text" id="user-input" placeholder="Ask me about crops, sales, pricing..." autocomplete="off">
            <button id="send-button">Send <span>➤</span></button>
        </div>
    </div>

    <script>
        const messagesContainer = document.getElementById('chatbot-messages');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');

        // Function to add a message to the chat
        function addMessage(sender, text) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            messageDiv.innerHTML = `<div class="message-bubble">${text}</div>`;
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight; // Auto-scroll to bottom
        }

        // Simulate bot typing delay
        function simulateBotTyping(callback) {
            const typingIndicator = document.createElement('div');
            typingIndicator.classList.add('message', 'bot');
            typingIndicator.innerHTML = '<div class="message-bubble typing-indicator">...</div>';
            messagesContainer.appendChild(typingIndicator);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            setTimeout(() => {
                messagesContainer.removeChild(typingIndicator);
                callback();
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, 800); // Simulate typing for 0.8 seconds
        }

        // Bot response logic
        function getBotResponse(userMessage) {
            userMessage = userMessage.toLowerCase().trim();

            if (userMessage.includes('hello') || userMessage.includes('hi')) {
                return "Hello there! How can I assist you with your farming needs or sales today?";
            } else if (userMessage.includes('sell items') || userMessage.includes('list products')) {
                return "To sell your farm items, you can visit our 'Sell Your Harvest' section. We offer easy listing tools! What type of items are you looking to sell?";
            } else if (userMessage.includes('pricing') || userMessage.includes('cost') || userMessage.includes('plans')) {
                return "We have three excellent pricing plans for farmers: Basic, Pro, and Advance. Each plan offers different features for selling your produce and managing your farm. You can find full details on our <a href='#' style='color: #fff; text-decoration: underline;' onclick='alert(\"Redirecting to Pricing Page (placeholder)\")'>Pricing Page</a>.";
            } else if (userMessage.includes('basic plan')) {
                return "The Basic Plan is great for new sellers! It allows you to list up to 5 items per month and provides basic analytics. Perfect for getting started!";
            } else if (userMessage.includes('pro plan')) {
                return "Our Pro Plan offers unlimited listings, priority support, and advanced marketing tools to help your products reach more buyers. It's our most popular choice!";
            } else if (userMessage.includes('advance plan')) {
                return "The Advance Plan is designed for large-scale farmers. It includes all Pro features plus dedicated account management, bulk listing tools, and exclusive market insights.";
            } else if (userMessage.includes('contact support')) {
                return "You can reach our support team via email at support@farmerwebsite.com or call us at 1-800-FARM-HELP. We're here to help!";
            } else if (userMessage.includes('crops') || userMessage.includes('harvest')) {
                return "Are you looking for information on specific crops, or perhaps tips on improving your harvest? I can provide general advice or direct you to our resources section.";
            } else if (userMessage.includes('thank you') || userMessage.includes('thanks')) {
                return "You're most welcome! Is there anything else I can help you with?";
            } else {
                return "I'm still learning! Could you please rephrase your question? I can help with topics like selling items, pricing plans (Basic, Pro, Advance), or general farm inquiries.";
            }
        }

        // Handle sending messages
        function sendMessage() {
            const messageText = userInput.value.trim();
            if (messageText === '') return;

            addMessage('user', messageText);
            userInput.value = ''; // Clear input

            simulateBotTyping(() => {
                const botResponse = getBotResponse(messageText);
                addMessage('bot', botResponse);
            });
        }

        // Event listeners
        sendButton.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        });

        // Initial welcome message from the bot
        document.addEventListener('DOMContentLoaded', () => {
            addMessage('bot', "Hello! I'm FarmerBot, your assistant for the Farmer's Market website. How can I help you today? (e.g., 'How can I sell items?', 'Tell me about pricing plans')");
        });
    </script>
</body>
</html>
